# Math: circle_packing — GraphEvolve: policy-driven search over the ExperienceGraph (no islands)
language: python
diff_based_generation: false      # GraphEvolve generates full rewrites
max_iterations: 100
checkpoint_interval: 1
max_solution_length: 60000

llm:
  api_base: https://api.int2.net/v1
  models:
    - name: "glm-4.7"
      weight: 1.0
  max_tokens: 32000
  timeout: 800
  retries: 2
  retry_delay: 0
  thinking: false
  reasoning_effort: "low"
  guide_models:
    - name: "glm-4.7"
      weight: 1.0
      thinking: false
  experience_graph_models:
    - name: "glm-4.7"
      weight: 1.0
      thinking: false

prompt:
  system_message: 'You are an expert mathematician specializing in circle packing problems and computational geometry. Your
    task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square,
    maximizing the sum of their radii. The AlphaEvolve paper achieved a sum of 2.635 for n=26.


    Key geometric insights:

    - Circle packings often follow hexagonal patterns in the densest regions

    - Maximum density for infinite circle packing is pi/(2*sqrt(3)) ≈ 0.9069

    - Edge effects make square container packing harder than infinite packing

    - Circles can be placed in layers or shells when confined to a square

    - Similar radius circles often form regular patterns, while varied radii allow better space utilization

    - Perfect symmetry may not yield the optimal packing due to edge effects


    Focus on designing an explicit constructor that places each circle in a specific position, rather than an iterative search
    algorithm.

    '

evaluator:
  timeout: 360
  cascade_evaluation: true
  cascade_thresholds:
  - 0.3
  - 0.6

monitor:
  enabled: true
  summary_api_base: https://api.int2.net/v1
  summary_model: "glm-4.7"

log_level: "DEBUG"

search:
  type: graphevolve
  database:
    bootstrap_k: 5
    tau_stag: 0.01
    sigmoid_lambda: 100.0
    decay_rho: 0.9
    initial_g_global: 0.03
    bandit_alpha: 0.5
    bandit_beta: 0.5
    w_max: 10.0
    ucb_c: 1.0
    powerlaw_alpha: 1.0
    context_solutions_m: 2
    previous_attempts_n: 5
    crossover_set_size: 5
    crossover_max_attempts: 8
    enable_error_retry: true
    max_error_retries: 2
    use_idea_stage: false
    diversity_mode: "llm"
    exploit_sampling: "local"
    analyze_graph: false
    force_attach_existing: false
    # Code-generation scope
    evolve_block_only: true    # prompt + store only the mutable EVOLVE block, merge into the fixed wrapper
    exploit_diff_based: true   # EXPLOIT mutates the parent via SEARCH/REPLACE diffs (crossover/space = full rewrite)
