# EPLB — GraphEvolve: policy-driven search over the ExperienceGraph (no islands)
language: python
diff_based_generation: false      # GraphEvolve generates full rewrites
max_iterations: 100
checkpoint_interval: 1
max_solution_length: 60000

llm:
  api_base: https://api.int2.net/v1
  models:
    - name: "glm-4.7"
      weight: 1.0
  max_tokens: 32000
  timeout: 800
  retries: 2
  retry_delay: 0
  thinking: true
  reasoning_effort: "medium"
  guide_models:                   # used for crossover diversity verification
    - name: "glm-4.7"
      weight: 1.0
      thinking: false
  experience_graph_models:        # used by ExperienceGraph placement/grouping
    - name: "glm-4.7"
      weight: 1.0
      thinking: false

prompt:
  system_message: |-
    You are an expert programmer specializing in optimization algorithms. Your task
    is to improve the Mixture-of-Expert models Expert Parallelism Load Balancer
    (MoE EPLB) expert rearrangement algorithm.

    This algorithm will take the load metrics recorded by the vLLM server, and
    rearrange the experts to balance the load. It can make replicas of some experts
    to achieve better load balancing.

    Your goal will be two-fold:
    1. Improve the algorithm to achieve better load balancing; while
    2. Improve the algorithm to be more efficient, i.e. reduce the execution time
       of the algorithm itself, since perfect load balancing is NP-hard.

    The current algorithm is implemented in the `rebalance_experts` function.

evaluator:
  timeout: 360

monitor:
  enabled: true
  summary_api_base: https://api.int2.net/v1
  summary_model: "glm-4.7"

log_level: "DEBUG"

search:
  type: graphevolve
  database:
    # Bootstrap: space-explore rounds to seed graph with diverse directions
    bootstrap_k: 5
    # Tier 1 — circuit breaker + 2-arm action bandit
    tau_stag: 0.01
    sigmoid_lambda: 100.0
    decay_rho: 0.9
    initial_g_global: 0.03
    bandit_alpha: 0.5
    bandit_beta: 0.5
    w_max: 10.0
    # Tier 2a — UCB direction + power-law parent / context
    ucb_c: 1.0
    powerlaw_alpha: 1.0
    context_solutions_m: 2
    previous_attempts_n: 5
    # Tier 2b — crossover set
    crossover_set_size: 5
    crossover_max_attempts: 8
    # Error retry
    enable_error_retry: true
    max_error_retries: 2
    # Optional features
    use_idea_stage: false
    diversity_mode: "llm"
    exploit_sampling: "local"
    analyze_graph: false
    force_attach_existing: false
    # Code-generation scope
    evolve_block_only: true    # prompt + store only the mutable EVOLVE block, merge into the fixed wrapper
    exploit_diff_based: true   # EXPLOIT mutates the parent via SEARCH/REPLACE diffs (crossover/space = full rewrite)
